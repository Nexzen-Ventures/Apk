.download-btn:active{transform:scale(.96)}
.download-btn .icon{font-size:24px}
.file-size{color:rgba(255,255,255,.5);font-size:12px;margin-top:12px;position:relative;z-index:1}
.footer{margin-top:30px;color:rgba(255,255,255,.15);font-size:10px;letter-spacing:3px;text-transform:uppercase}
.dots{display:flex;gap:5px;justify-content:center;margin-bottom:15px;position:relative;z-index:1}
.dots span{width:5px;height:5px;border-radius:50%;display:block;animation:dotPulse 2s ease-in-out infinite}
.dots .d1{background:#fbbf24;animation-delay:0s}
.dots .d2{background:#34d399;animation-delay:.3s}
.dots .d3{background:#f472b6;animation-delay:.6s}
.dots .d4{background:#ec4899;animation-delay:.9s}
@keyframes dotPulse{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}
@media(max-width:480px){.card{padding:30px 20px}.logo{font-size:36px}.app-name{font-size:24px}.download-btn{font-size:16px;padding:16px 20px}}
